<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeRequester</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <script type="module" src="../JS/script.js"></script>
  <script defer src="../JS/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" type="image/x-icon" href="../favicon.ico?v=3">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary px-3">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
        aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand me-auto" href="/HTML/home.html">AnimeRequester</a>

      <div class="collapse navbar-collapse" id="navbarToggler">
        <div class="d-flex align-items-center ms-auto">
          <label class="me-2 mb-0" for="search-by">Search by : </label>
          <select id="search-by" class="form-select me-2" style="width: auto;" aria-label="Search filter">
            <option disabled selected value="0">Select ...</option>
            <option value="1">Title</option>
            <option value="2">ID</option>
            <option value="3">Rank</option>
            <option value="4">Genre</option>
          </select>
          <div class="d-flex flex-column align-items-start" id="search"></div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div id="api-rate-limit-alert"></div>
    <br><br><br>
    <h3 id="search-welcome-message" class="text-center" style="width: 60%; min-height: 4rem; margin: auto; display: flex; align-items: center; justify-content: center;">Vous pouvez rechercher selon différents critères : Titre, ID sur Kitsu API, sa place dans le classement des animes les plus visionnés, et pas multiples genres !</h2>
    <div class="container-fluid" id="board"></div>
  </main>

  <footer class="bottom fixed-bottom bg-body-tertiary">
    <div class="text-center p-3">
      © 2026 Copyright:
      <a class="text-body" href="https://github.com/TXC-VIKTOR/">TXC-VIKTOR</a> |
      <a class="text-body" href="https://github.com/GalaxyShadow99/"> GalaxyShadow99</a> |
      <a class="text-body" href="https://github.com/Naexys/"> Naexys</a>
      <button id="theme-change"></button>
    </div>
  </footer>
</body>

</html>
