<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeRequester</title>
  <script src="../JS/redirect.js"></script>
  <link rel="stylesheet" href="../CSS/style.css">
  <script type="module" src="../JS/script.js"></script>
  <script defer src="../JS/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="favicon" href="/favicon.ico?v2">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary px-3">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
        aria-controls="navbarToggler" aria-expanded="false" aria-label="Toogle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand" href="#">AnimeRequester</a>

      <div class="collapse navbar-collapse" id="navbarToggler">
        <span class="navbar-text mb-0 me-2">Remaining API requests :<span class="badge"
            id="remaining-requests">30</span></span>
        <span class="navbar-text mb-0 me-auto">Reset API :<span class="badge" id="reset-timer">0</span></span>
        <label class="me-1" for="search-by">Search by : </label>
        <select id="search-by" class="form-select me-2" aria-label="Default select example">
          <option disabled selected value="0">Select ...</option>
          <option value="1">Title</option>
          <option value="2">ID</option>
          <option value="3">Rank</option>
          <option value="4">Genre</option>
        </select>
        <div class="me-5 d-flex flex-column align-items-start" id="search"></div>
        <div class="navbar-nav">
          <a class="btn border border-current" href="../index.html">Change APIKey</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div id="api-rate-limit-alert"></div>
    <div class="container-fluid" id="board"></div>
  </main>

  <footer class="bottom fixed-bottom bg-body-tertiary">
    <div class="text-center p-3">
      © 2026 Copyright:
      <a class="text-body" href="https://github.com/TXC-VIKTOR/">TXC-VIKTOR</a> |
      <a class="text-body" href="https://github.com/GalaxyShadow99/"> GalaxyShadow99</a> |
      <a class="text-body" href="https://github.com/Naexys/"> Naexys</a>
      <button id="theme-change"></button>
    </div>
  </footer>
</body>

</html>
