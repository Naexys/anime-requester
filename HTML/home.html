<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeRequester</title>
  <link rel="stylesheet" href="../CSS/style.css" />
  <script type="module" src="../JS/script.js"></script>
  <script defer src="../JS/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">AnimeRequester</a>

        <span class="navbar-text mb-0">Remaining API requests: <span id="remaining-requests">30</span></span>
        <span class="navbar-text mb-0">Reset API : <span id="reset-timer">0</span></span>

        <select class="form-select" aria-label="Default select example">
          <option disabled selected value="0">Search by : </option>
          <option value="1">Title</option>
          <option value="2">ID</option>
          <option value="3">Rank</option>
          <option value="4">Genre</option>
        </select>

        <div id="search">
          
        </div>

        <a href="../index.html" class="nav-link active">Change APIKey</a>
      </div>
    </nav>
  </header>

  <div class="container-fluid" id="board"></div>

  <footer class="bottom">
    <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05)">
      © 2026 Copyright:
      <a class="text-body" href="https://github.com/TXC-VIKTOR/">TXC-VIKTOR</a>
      <a class="text-body" href="https://github.com/GalaxyShadow99/">| GalaxyShadow99 |</a>
      <a class="text-body" href="https://github.com/Naexys/">Naexys</a>
      <button id="theme-change"></button>
    </div>
  </footer>
</body>

</html>
