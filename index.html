<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeRequester - Welcome</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/registration.js"></script>
    <script defer src="JS/theme.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <main>
        <div class="card position-absolute top-50 start-50 translate-middle text-center" style="max-width: 450px; width: 90%;">
            <div class="card-body py-4">
                <h1 class="card-title h3 mb-3">Bienvenu sur AnimeRequester</h1>
                <p class="card-text text-muted mb-4">
                    Cette application utilise <a href="https://kitsu.io" target="_blank" rel="noopener">Kitsu API</a>.
                    Pas besoin de clé d'API ni de limite quotidienne, profitez pleinement de l'application sans limites d'utilisations !
                </p>
                <div class="d-grid gap-2">
                    <button id="go" class="btn btn-primary btn-lg">Utiliser AnimeRequester</button>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <a href="https://github.com/Naexys/anime-requester" target="_blank" rel="noopener">GitHub</a>
                <button id="theme-change"></button>
            </div>
        </div>
    </main>
</body>

</html>
