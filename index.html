<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Registration</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script defer src="JS/registration.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <main>
        <div class="card position-absolute top-50 start-50 translate-middle">
            <div class="card-body">
                <h1 class="card-title">Enter your <a href="https://rapidapi.com/brian.rofiq/api/anime-db">Anime DB</a> Rapidapi API key</h1>
                <div class="input-group">
                    <input id="input_api" type="text" class="form-control" placeholder="Enter your API key ...">
                    <button id="go" class="btn btn-outline-secondary">Go !</button>
                </div>
            </div>
            <div class="card-footer">
                <a href="https://github.com/Naexys/anime-requester">Github</a>
            </div>
        </div>
    </main>
</body>

</html>
